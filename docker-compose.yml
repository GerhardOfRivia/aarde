name: aarde

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aarde}
      POSTGRES_USER: ${POSTGRES_USER:-aarde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aarde-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  aarde:
    build: .
    environment:
      AARDE_DATABASE_URL: postgres://${POSTGRES_USER:-aarde}:${POSTGRES_PASSWORD:-aarde-local}@postgres:5432/${POSTGRES_DB:-aarde}?sslmode=disable
      AARDE_LISTEN_ADDRESS: :8080
      AARDE_LOG_LEVEL: ${AARDE_LOG_LEVEL:-info}
      AARDE_WEB_PUBLIC_READ: ${AARDE_WEB_PUBLIC_READ:-false}
      AARDE_WEB_BASEMAP: ${AARDE_WEB_BASEMAP:-offline}
      AARDE_VIEWER_MAX_DIMENSION: ${AARDE_VIEWER_MAX_DIMENSION:-4096}
      AARDE_VIEWER_LAYER_PIXELS: ${AARDE_VIEWER_LAYER_PIXELS:-8000000}
      AARDE_VIEWER_SCENE_PIXELS: ${AARDE_VIEWER_SCENE_PIXELS:-24000000}
      AARDE_VIEWER_CONCURRENT: ${AARDE_VIEWER_CONCURRENT:-2}
      AARDE_VIEWER_TIMEOUT: ${AARDE_VIEWER_TIMEOUT:-20s}
      AARDE_VIEWER_TEMP_DIR: /tmp
      AARDE_VIEWER_SOURCE_ROOTS: /data
      AARDE_WEB_TOKEN_PATH: ${AARDE_WEB_TOKEN_PATH:-/home/aarde/.local/state/aarde/web.token}
    # Bounded, disposable whole-segment display buffers. Original /data is read-only.
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
